# 任务档案 · GetCamera.yaml · 主线挑战（V2.3 批量导入）
# ★ 数据源：主线挑战23条-整理数据.json（2026-10-08 V2 网络查证）
key: GetCamera

npc:
  cn: 乔舒亚

loc: 监视堡垒

start: 在监视堡垒与洛贝利和乔舒亚对话获得（激活监视堡垒鸟望台后）

note: |-
  乔舒亚给你看了一块来自地底的石板，上面拓着一个人形画像，她认为这是曾生活在地底的种族存在的证据。洛贝利说要亲自下地底帮她寻找更多画像，并希望你必要时用普尔亚平板的相机拍照。去监视堡垒以南的巨穴与他会合吧。

reward:
  - 明亮花籽
  - 箭
  - 相机
  - 海拉鲁图鉴
  - 左纳乌材料×5

requires:
  - 海拉鲁城堡的异变

# 主坐标覆盖：统一用校对接取点（卡片坐标区/图标/图层都跟它走）
place:
  X: -255
  Z: -297
  H: 12

flowPts:
  - X: -255
    Z: -297
    H: 12

