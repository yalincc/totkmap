# 任务档案 · CarryToShrine01.yaml · 水晶搬运（神庙挑战）· ★ 完整范例（2 点连线）
# ★ 本档案是水晶搬运的示范：place = 水晶起点（ROM actor 提取），
#   flowPts 两点 = 水晶 → 神庙。
# ★ place = 水晶起点（2630,2745,529，Cave_Eldin_0020 内熔岩巨人掉落，ROM actor 修正）；
#   flowPts 终点 = 神庙入口 actor 精确坐标（2961,2758,524）。
#   （旧攻略值 2774,2786,523 与 ROM 差 331m，2026-10-10 按 ROM 修正）
key: CarryToShrine01

# 主坐标覆盖：水晶起点（玩家真正要跑的核心）
place:
  X: 2630
  Z: 2745
  H: 529
  _note: 水晶起点（实机/ROM actor）
start: 在死亡之山的破魔神庙（摩摩希卡神庙）前触发，光线指示水晶所在，即可开始搬运。

note: |-
  水晶在**矿山半山腰的坑道内**（死亡之山东坑道）——破岩进洞、搭矿车前进，击败**熔岩巨人**取得水晶，再用矿车把水晶运出山洞。
  ⚠ **搬运途中不能传送**，也不能放手——水晶会原地停留，人离开就掉落。
  洞内温度很高，**需要防火套装/耐火料理**；洞口若被封需用炸弹花炸开。
  雨天水晶容易滑落，可等雨停再搬。

deliver: 把水晶搬到摩摩希卡神庙底座凹槽处放下（神庙随之升起、可进入）。

reward:
  - 神庙可进入
  - 祝福之光

flowPts:
  - X: 2630
    Z: 2745
    H: 529
    _note: 水晶起点
  - X: 2961
    Z: 2758
    H: 524
    _note: 神庙入口
_source: 2026-10-08 水晶搬运 21 条批量导入；本档案为 2 点连线范例（2026-10-10 ROM 修正）
_warnings:
  - 水晶起点坐标为 ROM actor 提取值（Cave_Eldin_0020 熔岩巨人）；神庙终点为 actor 精确坐标
