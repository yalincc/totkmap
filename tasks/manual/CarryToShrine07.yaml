key: CarryToShrine07

# 主坐标覆盖：神庙入口（比 ROM 任务区域点准，天空诸岛偏差大尤其明显）
place:
  X: -1900
  Z: -2342
  H: -1
  _note: 水晶起点（实机/ROM actor）
start: 在拉卡克达吉托神庙前触发，光线指示水晶所在，即可开始搬运。

deliver: 把水晶搬到拉卡克达吉托神庙底座凹槽处放下（神庙随之升起、可进入）。

reward:
  - 神庙可进入
  - 祝福之光

flowPts:
  - X: -1900
    Z: -2342
    H: -1
    _note: 水晶起点
  - X: -2037
    Z: -1852
    H: 64
    _note: 神庙入口
note: |-
  水晶在**峡谷中远处的篝火旁（需组装六轮车运回）**。
  ⚠ **搬运途中不能传送**，也不能放手——水晶会原地停留，人离开就掉落。
  跟随指引在远处的篝火旁找到水晶，用旁边左纳乌装置组装一辆六轮车，把水晶装车上带回神庙。宝箱：左纳尼乌姆之刚大剑。

