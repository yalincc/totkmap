# 任务档案 · CraftShadowPicture.yaml · 独立显现（神庙挑战）
# ★ 批量导入：2026-10-08 独立显现 10 条（数据源=老大攻略整理）
# ★ 本组无精确坐标（显现条件各异）：不写 place/flowPts，位置走 note 文字；
