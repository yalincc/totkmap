    Z: 3101
    H: 514
    _note: 神庙入口
note: |-
  水晶在**洞窟内坡道旁，水晶沉在冰水中**。
  ⚠ **搬运途中不能传送**，也不能放手——水晶会原地停留，人离开就掉落。
  进入洞窟向左前方深入，在坡道上找到神庙；水晶沉在冰水中——用火融化湖边冰块可发现宝箱，用胶囊召唤「翼」与水晶组合取出。宝箱：黄玉。

