key: HorseInnChallenge001
npc:
  cn: 可姿米
loc: 新玛丽塔驿站

start: 新玛丽塔驿站门口，与可姿米对话接取任务。

note: |-
  修好马车（驿站旁地上两个车轮装到轮轴）+ 驯服驿站东边草原的野马（蹲下背后接近防惊跑，骑乘提示后上马连按L安抚）。
deliver: 把修好的马车牵回可姿米面前（交付=两件事都完成：装车轮 + 驯服野马）。

reward:
  - 银卢比 100

