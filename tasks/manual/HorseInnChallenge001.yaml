# 任务档案 · HorseInnChallenge001.yaml · V2.3 示例档案（迷你挑战）
# ★ 从 V2.2 guide{...} 容器迁移到 V2.3 顶层字段的示范（guide 容器写法仍兼容）
key: HorseInnChallenge001
npc:
  cn: 可姿米
loc: 新玛丽塔驿站

start: 新玛丽塔驿站门口，与可姿米对话接取任务。

note: |-
  两件事：
  ① **修马车**：驿站旁地上放着两个车轮，用**究极手**把它们装到马车的轮轴上。
  ② **驯野马**：野马在**驿站东边的草原上**。
  ⚠ **必须蹲下从背后慢慢接近**——正面靠近它会受惊直接跑掉，这是最容易白跑的一点；出现骑乘提示后按 A 键上马，再连按 L 键安抚。

deliver: 把修好的马车牵回可姿米面前（交付=两件事都完成：装车轮 + 驯服野马）。

reward:
  - 银卢比 100

_source: V2.3 示例档案：迷你挑战类（由 V2.2 格式迁移演示，内容不变）
