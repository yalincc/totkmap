# ============================================================
# 任务档案 · 标准模板（tasks/manual/<任务key>.yaml）· V2.3 简化版
# ------------------------------------------------------------
# ★ 只放「人工补充」的部分，任务本体（坐标/分类/层级）仍由 ROM 抽取。
# ★ 下划线前缀（_source/_warnings）是给人看的，生成时忽略。
# ★ 全部字段可选：没有就删掉，不用留空；卡片对应区块自动隐藏。
#   唯一硬性要求：key 必须与 app/data/tasks.js 里的任务 key 一致。
# ★ 模板按任务流程组织：接取(start) → 地点(flowPts) → 交付(deliver) → 奖励(reward)。
#   V2.3 起 start/note/deliver/reward 写在顶层；V2.2 的 guide{...} 容器写法仍兼容。
# ============================================================

key: PhotoSpot_Challenge_05          # 必填：任务 key（tasks.js 里存在）

# 校对后的中文名（一般 ROM 已有，可不写）
name: 装点河畔驿站的画作

# NPC 中文名（人工确认；ROM 只给了 actor id，不显示人名）
npc:
  cn: 玛肯保

# 地点中文名（可选；仅当产物 locCn 缺失/需修正时写，如 HourseInnChallenge004）
loc: 米那卡雷马宿

# 主坐标覆盖（可选；V2.3-3 新增。默认图标/卡片坐标 = ROM 任务主坐标；
# 需要把坐标定位到「任务起点」而非激活点时写，如搬水晶任务 = 水晶起点）
# place:
#   X: 2774
#   Z: 2786
#   H: 523

# 前置条件（ROM 推不出的才写；字符串自动按 flag 处理，dict 可指定 quest 跳转）
requires:
  - type: flag                      # flag = 条件型（只显示灰字条件）
    reqName: 完成任意 1 个主线神殿（解锁照相机）
  # - type: quest                   # quest = 任务型（可点击跳转）
  #   key: HyruleCastleIncident     #   必填：库内任务 key
  #   reqName: 海拉鲁城堡的异变

# ── 攻略正文（卡片口径：只放「会让玩家白跑的点」，坐标/价格/按键提示不进）──
start: 进河畔驿站，调查墙上的空画框，与驿站主人玛肯保对话。   # 在哪找谁接

note: 去地表初始台地的时之神殿遗迹拍大女神像，照片里要有「时之神殿像」的红色感叹号提示。  # 注意事项/关键点

deliver: 把拍好的照片给玛肯保看。     # V2.3 新增：交什么（物品/拍照/送人/其他）

reward:                               # 任务奖励
  - 1 点驿站点数
  - 精力炒螃蟹

# 流程点（人工补的坐标；口径=游戏 UI 坐标 X 东西 / Z 南北 / H 高度）
flowPts:
  - X: -823
    Z: -2029
    H: 119
    _note: 地表·初始台地时之神殿遗迹·大女神像

# 图层覆盖（18 地表 / 19 地底 / 20 天空；默认按高度自动判，一般不用写）
layers: [18]

# ── 元信息（生成时忽略）────────────────────────────
_source: 老大 2026-10-07 档案；坐标经 Gamerant 核对
_warnings:
  - 不要用天空层时之神殿（0453, -0783, 1466），那是另一个同名景点
